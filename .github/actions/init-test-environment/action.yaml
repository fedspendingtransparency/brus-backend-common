    # Have to do this again as its a separate job
    - name: Build test .env off .env.template
      shell: bash
      run: cp ./brus-backend-common/.github/.env.test .env

#    - name: Set up Docker Buildx
#      uses: docker/setup-buildx-action@v3

#    - name: Use cached image in test job
#      uses: docker/bake-action@v7
#      with:
#        targets: brus-backend-common
#        set: |
#          brus-backend-common.cache-from=type=gha
#        load: true

    - name: Download docker image
      if: ${{ inputs.is-integration-test == 'true' }}
      uses: actions/download-artifact@v4
      with:
        name: brus-backend-common
        path: /tmp

    - name: Load docker image
      shell: bash
      if: ${{ inputs.is-integration-test == 'true' }}
      run: docker image import /tmp/brus-backend-common.tar brus-backend-common:latest

    - name: Run services with Docker Compose
      if: ${{ inputs.is-integration-test == 'true' }}
      uses: hoverkraft-tech/compose-action@v2.5.0
      with:
        compose-file: ./brus-backend-common/docker-compose.yml
        # Use --no-build as the images are already built by the bake action
        up-flags: 'brus-backend-common minio --no-build'


    - name: Wait on minio container to be available
      if: ${{ inputs.is-integration-test == 'true' }}
      shell: bash
      run: |
        ttl=30; echo "Try minio conn from container for $ttl seconds"; until [ $ttl -le 0 ] || curl $MINIO_HOST:10002; do echo $ttl; ((ttl--)); sleep 1; done; [ $ttl -gt 0 ]