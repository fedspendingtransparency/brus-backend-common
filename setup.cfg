[tool:pytest]
python_files=test_*.py *_test.py *_tests.py *Tests.py

[flake8]
select=C,E,F,W,B,B950
ignore=E501,W503,E203,F541,E704
extend-ignore=W605,W503,E203
exclude=.venv,venv,build,brus_backend_common.egg-info,brus_backend_common/*/migrations/*
max-line-length=120


[coverage:run]
omit =
    # tests themselves don't need coverage measurements
    tests/*
    */migrations/*
    .venv/*

