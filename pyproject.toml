[project]
name = "brus_backend_common"
version = "0.0.1"
authors = [
  {name = "fedspendingtransparency"},
]
description = "A shared package of scripts, models, and libraries to be shared across fedspendingtransparency repos"
readme = 'README.md'
requires-python = '>=3.12'
dependencies = [
    # explicit
    "boto3==1.34.58",
    "boto3-stubs[s3]==1.34.58",
    "deltalake==1.5.0",
    "numpy==1.26.4",

    # Opentelemetry Dependencies
    "opentelemetry-api==1.28.2",
    "opentelemetry-distro==0.49b2",
    "opentelemetry-exporter-otlp==1.28.2",
    "opentelemetry-exporter-otlp-proto-common==1.28.2",
    "opentelemetry-exporter-otlp-proto-grpc==1.28.2",
    "opentelemetry-exporter-otlp-proto-http==1.28.2",
    "opentelemetry-instrumentation==0.49b2",
    "opentelemetry-instrumentation-asgi==0.49b2",
    "opentelemetry-instrumentation-asyncio==0.49b2",
    "opentelemetry-instrumentation-asyncpg==0.49b2",
    "opentelemetry-instrumentation-boto3sqs==0.49b2",
    "opentelemetry-instrumentation-botocore==0.49b2",
    "opentelemetry-instrumentation-dbapi==0.49b2",
    "opentelemetry-instrumentation-django==0.49b2",
    "opentelemetry-instrumentation-elasticsearch==0.49b2",
    "opentelemetry-instrumentation-flask==0.49b2",
    "opentelemetry-instrumentation-grpc==0.49b2",
    "opentelemetry-instrumentation-logging==0.49b2",
    "opentelemetry-instrumentation-psycopg2==0.49b2",
    "opentelemetry-instrumentation-redis==0.49b2",
    "opentelemetry-instrumentation-requests==0.49b2",
    "opentelemetry-instrumentation-sqlite3==0.49b2",
    "opentelemetry-instrumentation-system-metrics==0.49b2",
    "opentelemetry-instrumentation-threading==0.49b2",
    "opentelemetry-instrumentation-tortoiseorm==0.49b2",
    "opentelemetry-instrumentation-urllib==0.49b2",
    "opentelemetry-instrumentation-urllib3==0.49b2",
    "opentelemetry-instrumentation-wsgi==0.49b2",
    "opentelemetry-propagator-aws-xray==1.0.1",
    "opentelemetry-proto==1.28.2",
    "opentelemetry-sdk==1.28.2",
    "opentelemetry-semantic-conventions==0.49b2",
    "opentelemetry-util-http==0.49b2",
    # The above packages are listed and pinned to avoid using the 'opentelemetry-bootstrap -a install' command

    # this version works with SQLAlchemy but we're most likely not using SQLAlchemy so it can upgrade
    "pandas==2.1.4",
    "pandas-stubs==3.0.0.260204",
    "polars==1.34.0",
    "psutil==5.9.8",
    # Keeping pyarrow at this earlier version as pip doesn't seem to store the compiled packages for higher versions
    "pyarrow==15.0.1",
    "pyarrow-stubs==10.0.1.9",
    "pydantic[dotenv]==1.9.2",
    "pyhive[hive_pure_sasl]==0.7.0",
    "python-dateutil==2.9.0",
    "requests==2.31.0",
    "types-docker==7.1.0.20260109",
    "types-python-dateutil==2.9.0.20260124",
    "types-requests==2.32.4.20260107",
    "types-xmltodict==1.0.1.20260113",
    "xmltodict==1.0.3",

    # implicit
    "thrift==0.22.0",
    "thrift-sasl==0.4.3",
    "botocore @ git+https://github.com/fedspendingtransparency/botocore-python39-md5.git@md5-fix-1-34-58#egg=botocore",
]

[project.optional-dependencies]
dev = [
    "docker==7.0.0",
    "pytest==8.2.0",
    "pytest-cov==4.1.0",
    "pytest-pretty==1.3.0",
    "pytest-xdist==3.7.0",
    "requests-mock==1.12.1",
    "ruff==0.14.14",
]
spark = [
    "delta-spark==2.4.0",
    "pyspark==3.4.1",
]
awscli = [
    "awscli==1.32.58",
]

[tool.ruff]
line-length = 120
target-version = 'py312'

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
preview = true  # enable new rules
select = ['C','E','F','W','B']
ignore = ['E203','E501','F541','W605']
exclude = [
    '.git',
    '.venv',
    'venv',
    '**/migrations/**',
    'build',
    'brus-backend-common.egg-info'
]


[tool.coverage.run]
omit = [
    # tests themselves don't need coverage measurements
    "*/tests/*",
    # nor db migration scripts
    "*/migrations/*",
    '.venv/*'
]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_lines = [
    # Have to re-enable the standard pragma
    "pragma: no cover"
]

[tool.mypy]
disable_error_code = [
    # No need to declare types for simple function variables
    "var-annotated",
    # MyPy struggles with instantiated subclass attributes
    "attr-defined"
]

[tool.pytest.ini_options]
python_files = [
    'test_*.py',
    '*_test.py',
    '*_tests.py',
    '*Tests.py'
]
markers = [
    "signal_handling: Mark all tests that import the signal library and invoke signals. This MUST be done on the main thread, and can cause errors if pytest-xdist subordinates parellel test sessions to background threads.",

    # These are "auto" marked based on fixture usage. See conftest.py pytest_collection_modifyitems
    "spark: Mark all tests using the spark fixture. Can be selected with -m spark or deselected with -m (not spark)",
]
pythonpath = [
  "."
]
